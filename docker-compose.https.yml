# Optional HTTPS ingress. Use together with docker-compose.yml, not by itself.
services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HDOI_DOMAIN: ${HDOI_DOMAIN:?Set a DNS hostname only, without https:// or paths}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      queue-api:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
